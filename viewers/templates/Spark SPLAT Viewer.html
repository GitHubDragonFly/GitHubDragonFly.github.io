<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="encoding" content="utf-8" charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Spark SPLAT (3D Gaussian Splatting) Viewer, supporting PLY, RAD, KSPLAT, SPLAT, SPZ and SOG formats">
    <link rel="stylesheet" href="../static/css/desktop-viewers.css">
    <link rel="shortcut icon" href="../../images/favicon.ico" type="image/x-icon"/>

    <script>
      // Resource Loading Failures (404 or similar)
      window.addEventListener( 'error', function ( event ) {
        // We check if the target has a 'src' or 'href' to identify it as a resource
        if (event.target.src || event.target.href) {
          console.error( 'RESOURCE ERROR: ', {
            element: event.target.tagName,
            url: event.target.src || event.target.href,
            html: event.target.outerHTML
          });

          // If the failed resource is jQuery, show the alert immediately
          if ((event.target.src || '').includes('jquery')) {
            alert('jQuery failed to load. Limited functionality. Check your internet connection!');
          }

          if (init_running || render_requested) handle_error( 'RESOURCE ERROR' );
        }
      }, true); // The 'true' here is vital; it enables the "capturing" phase

      // Standard JavaScript Runtime Errors
      window.onerror = function ( message, source, lineno, colno, error ) {
        console.log( 'RUNTIME ERROR CAUGHT' );

        console.log({
          message: message, // Error message
          file: source,     // The script file where it happened
          line: lineno,     // Line number
          column: colno,    // Column number
          errorObj: error   // The actual Error object (includes stack trace)
        });

        if (init_running || render_requested) handle_error( 'RUNTIME ERROR' );

        // Returning 'true' prevents the error from showing up in the browser console
        return false; 
      };

      // Unhandled Promise Rejections (Async Errors)
      window.addEventListener( 'unhandledrejection', function ( event ) {
        console.warn( 'UNHANDLED PROMISE: ', event.reason );

        // event.promise is the promise that failed
        // event.reason is usually the error object or message

        if (init_running || render_requested) handle_error( 'UNHANDLED PROMISE' );
      });
    </script>

    <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@2.8.0/dist/es-module-shims.min.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.min.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/",
          "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark@2.1.0/dist/spark.module.js"
        }
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js" defer></script>

    <script>
      var SPARK, spark_renderer, splats, spz_loader, isRAD, isSPZ, isSplat, ftype, transcode;
      var THREE, manager, controls, renderer, scene, camera, render_requested, texture_loader;
      var mouse_down, mouse_wheel, events_initialized, isMobile, isNewiPad;
      var gui, gui_set = false, params, equi_enabled, tex;
      var ww = window.innerWidth, wh = window.innerHeight, slider_height = 0;
      var bounding_box, filename = '', bgnd_linear_gradient;
      var selected_local_file, selected_url_file = '', reset_rotation;
      var first_run = false, fr_count = 0, count = 0, init_running = false;
      var url_displayed = false, url_loading = false, menu_location_bottom = false;

      const pw = "<span style='color:red'>" + "Please Wait" + "</span>";

      const fmts = [ '.ply', '.rad', '.ksplat', '.splat', '.spz', '.sog', '.zip' ];

      // A simple utility to let the browser catch its breath
      const yieldToMainThread = () => new Promise( resolve => setTimeout( resolve, 0 ) );
    </script>

    <script type="module">
      import * as threejs from 'three';
      import * as sparkjs from '@sparkjsdev/spark';
      import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
      import { SPZLoader } from '../static/jsm/loaders/SPZWebGL2Loader.min.js';

      THREE = threejs;
      SPARK = sparkjs;

      manager = new THREE.LoadingManager();
      manager.onLoad = function() { mouse_wheel = true; }

      texture_loader = new THREE.TextureLoader( manager );
      spz_loader = new SPZLoader( manager );

      gui = new GUI( { autoPlace: false, container: document.getElementById('gui_position') } );
      set_gui_position();
    </script>

    <!-- Using three.js library: https://github.com/mrdoob/three.js -->
    <!-- Using spark Library from: https://github.com/sparkjsdev/spark -->
    <!-- Using jQuery: https://github.com/jquery/jquery -->

    <!-- mouse_wheel variable is used throughout as a trigger for rendering -->

    <title>Spark SPLAT Viewer (r185)</title>
  </head>
  <body onload="reset_all(); document_ready(); disabled_changed();" onresize="resize();">
    <div id="fixed_menu" class="fixed-menu">
      <div class="fm">
        <button title="URL of the remote splat" id="btn_url" onclick="show_url();" style="background-color: transparent; min-width: 34px;">URL</button>
        <button title="Browse Local Files" id="btn_file_input" style="background-color: transparent; min-width: 54px;" onclick="document.getElementById('file_input').click();">Browse</button>
        <label for="btn_file_input" title="Browse Local Files"></label>
        <input type="file" title="Browse Local Files" id="file_input" style="display: none;" onchange="init();" accept=".ply, .rad, .ksplat, .splat, .spz, .sog, .zip" />
        <button title="Toggle Equirectangular Background" id="btn_equi" onclick="set_equi();" style="display: none; background-color: transparent; color: blue; min-width: 25px;" disabled>Eq</button>
        <button title="Toggle Gradient Color Background" id="btn_bgnd_linear_gradient" onclick="set_bgnd_linear_gradient();" style="background-color: transparent; color: blue;" disabled>G</button>
        <select title="Quick XYZ Rotation" id="quick_rotation" disabled>
          <option title="Quick XYZ Rotation" value="" selected disabled>Rotate</option>
          <option title="Rotate 180x" value="180x" onclick="quick_x_rotation( '1' );">180x</option>
          <option title="Rotate 90x" value="90x" onclick="quick_x_rotation( '0.5' );">90x</option>
          <option title="Rotate -90x" value="-90x" onclick="quick_x_rotation( '-0.5' );">-90x</option>
          <option title="Rotate 180y" value="180y" onclick="quick_y_rotation( '1' );">180y</option>
          <option title="Rotate 90y" value="90y" onclick="quick_y_rotation( '0.5' );">90y</option>
          <option title="Rotate -90y" value="-90y" onclick="quick_y_rotation( '-0.5' );">-90y</option>
          <option title="Rotate 180z" value="180z" onclick="quick_z_rotation( '1' );">180z</option>
          <option title="Rotate 90z" value="90z" onclick="quick_z_rotation( '0.5' );">90z</option>
          <option title="Rotate -90z" value="-90z" onclick="quick_z_rotation( '-0.5' );">-90z</option>
        </select>
        <select title="Scale" id="model_scale" disabled>
          <option title="Model Scale" value="model_scale" selected disabled>Scale</option>
          <option title="Scale 0.05x" value="0.05x" onclick="set_model_scale( '0.05x' );">0.05x</option>
          <option title="Scale 0.1x" value="0.1x" onclick="set_model_scale( '0.1x' );">0.1x</option>
          <option title="Scale 0.2x" value="0.2x" onclick="set_model_scale( '0.2x' );">0.2x</option>
          <option title="Scale 0.5x" value="0.5x" onclick="set_model_scale( '0.5x' );">0.5x</option>
          <option title="Scale 2x" value="2x" onclick="set_model_scale( '2x' );">2x</option>
          <option title="Scale 5x" value="5x" onclick="set_model_scale( '5x' );">5x</option>
          <option title="Scale 10x" value="10x" onclick="set_model_scale( '10x' );">10x</option>
          <option title="Scale 20x" value="20x" onclick="set_model_scale( '20x' );">20x</option>
        </select>
        <button title="Reset" id="reset" onclick="reset_only();" style="display: none; background-color: transparent; color: maroon; min-width: 34px;" disabled>RST</button>
        <button title="Toggle Full Screen" id="btn_full_screen" onclick="full_screen();" style="display: none; background-color: transparent; min-width: 24px;"><p class="full_screen"></p></button>
        <button title="Switch Menu Location" id="btn_menu_location" onclick="change_menu_location();" style="display: none; background-color: transparent; min-width: 16px;">&#x2193</button>
        <div id="status_indicator" class="indicator"></div>
      </div>
      <div class="fm" id="url" style="display: none;">
        <label for="url_entry" title="Remote URL"></label>
        <input type="text" id="url_entry" placeholder="Type or paste URL here..." style="width: calc(75% - 12px);" />
        <button title="Load" id="btn_load" onclick="load_url_file();" style="min-width: 8.5%;">Load</button>
        <button title="Clear" id="btn_clear" onclick="clear_url();" style="min-width: 8.5%;">Clear</button>
      </div>
    </div>
    <div id="gui_position"></div>

    <div id="div_spinner" class="spinner"></div>
    <div id="div_error" class="error_msg">E R R O R !</div>
    <div id="div_loading" class="loading_msg">SPLAT Viewer</div>
    <div id="div_gif_rectangle" class="gif_rectangle"></div>

    <script>
      function return_false() { return false; }

      function set_gui_position() {
        if (!menu_location_bottom) {
          let fixed_menu_bottom = ( parseInt( $('#fixed_menu').outerHeight( true ) ) + 2 ).toString() + 'px';
          document.getElementById('gui_position').style.marginTop = fixed_menu_bottom;
        } else {
          document.getElementById('gui_position').style.marginTop = '2px';
        }

        mouse_wheel = true;
      }

      function show_url() {
        if (url_displayed) {
          document.getElementById('url').style.display = 'none';
          document.getElementById('btn_url').style.backgroundColor = 'transparent';
          url_displayed = false;
        } else {
          document.getElementById('url').style.display = 'block';
          document.getElementById('btn_url').style.backgroundColor = 'lightgreen';
          url_displayed = true;
        }

        if (gui) set_gui_position();

        mouse_wheel = true;
      }

      function load_url_file() {
        let url = document.getElementById('url_entry').value.trim();
        if (url !== '') { selected_url_file = url; url_loading = true; init(); }
      }

      function clear_url() { document.getElementById('url_entry').value = ''; }

      function initialize_event_listeners() {
        const arrow_keys = [ 'ArrowUp', 'ArrowDown', 'ArrowRight', 'ArrowLeft' ];
        const activeKeys = new Set();

        window.addEventListener( 'pointerdown', ( event ) => { mouse_down = true; count = 0; }, false);
        window.addEventListener( 'pointerup', ( event ) => { mouse_down = false; mouse_wheel = true; count = 0; }, false);
        window.addEventListener( 'wheel', ( event ) => { mouse_wheel = true; count = 0; }, false);
        window.addEventListener( 'keydown', ( event ) => {
          if (arrow_keys.some( k => k === event.key ) || event.ctrlKey || event.metaKey || event.shiftKey) {
            controls.listenToKeyEvents( window );
            activeKeys.add( event.key ); // Track this key
            mouse_wheel = true;
          }
        }, false);
        window.addEventListener( 'keyup', ( event ) => {
          activeKeys.delete( event.key ); // Remove this key

          if (controls && activeKeys.size === 0) {
            controls.stopListenToKeyEvents();
            mouse_wheel = false;
          }
        }, false);
      }

      function resize() {
        if (document.fullscreenElement || document.mozFullScreenElement ||
          document.msFullscreenElement || document.webkitFullscreenElement) {

          document.getElementById('btn_full_screen').style.backgroundColor = '#FFFF00';
        } else {
          document.getElementById('btn_full_screen').style.backgroundColor = 'transparent';
        }

        if (scene !== undefined) {
          mouse_wheel = true;

          ww = window.innerWidth;
          wh = window.innerHeight;

          renderer.setSize( ww, wh );

          camera.aspect = ww / wh;
          camera.updateProjectionMatrix();

          if (gui) set_gui_position();

          mouse_wheel = true;
        }
      }

      function full_screen() {
        if (document.fullscreenEnabled) {
          document.fullscreenElement ? document.exitFullscreen() : document.body.requestFullscreen();
        } else if (document.mozFullScreenEnabled) {
          document.mozFullScreenElement ? document.mozCancelFullScreen() : document.body.mozRequestFullScreen();
        } else if (document.msFullscreenEnabled) {
          document.msFullscreenElement ? document.msExitFullscreen() : document.body.msRequestFullscreen();
        } else if (document.webkitFullscreenEnabled) {
          document.webkitFullscreenElement ? document.webkitExitFullscreen() : document.body.webkitRequestFullscreen();
        }
      }

      function change_menu_location() {
        if (menu_location_bottom) {
          menu_location_bottom = false;
          document.getElementById('fixed_menu').style.top = 0;
          document.getElementById('fixed_menu').style.bottom = '';
          document.getElementById('btn_menu_location').innerHTML = '&#x2193';
          document.getElementById('btn_menu_location').style.backgroundColor = 'transparent';
        } else {
          menu_location_bottom = true;
          document.getElementById('fixed_menu').style.top = '';
          document.getElementById('fixed_menu').style.bottom = 0;
          document.getElementById('btn_menu_location').innerHTML = '&#x2191';
          document.getElementById('btn_menu_location').style.backgroundColor = '#FFFF00';
        }

        if (gui) set_gui_position();

        mouse_wheel = true;
      }
    </script>

    <script>
      function reset_scene_params() {
        if (scene) {
          if (scene.environment) {
            scene.environment.dispose();
            scene.environment = null;
          }

          if (scene.background) {
            scene.background.dispose();
            scene.background = null;
          }

          if (bgnd_linear_gradient) {
            bgnd_linear_gradient = false;
            document.getElementById('btn_bgnd_linear_gradient').style.backgroundColor = 'transparent';
          }

          mouse_wheel = true;
        }
      }

      async function set_bgnd_linear_gradient() {
        let lg = bgnd_linear_gradient;

        await reset_scene_params();

        if (!lg) {
          bgnd_linear_gradient = true;

          let canvas = document.createElement('canvas');
          canvas.width = ww;
          canvas.height = wh;

          let context = canvas.getContext( '2d', { willReadFrequently: true } );

          let gradient = context.createLinearGradient( 0, 0, 0, wh );
          let gradient_colors = [
            [ 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.15 ],
            [ '#151525', '#252535', '#353545', '#454555', '#656575', '#787888', '#8A8A9A', '#9A9AAA', '#A5A5B5' ]
          ];

          let i = gradient_colors[ 0 ].length;
          while( i-- ) { gradient.addColorStop( gradient_colors[ 0 ][ i ], gradient_colors[ 1 ][ i ] ); }

          context.fillStyle = gradient;
          context.fillRect( 0, 0, ww, wh );

          let lg_texture = new THREE.CanvasTexture( canvas );
          lg_texture.mapping = THREE.EquirectangularReflectionMapping;
          lg_texture.needsUpdate = true;

          scene.background = lg_texture;

          lg_texture.dispose();

          document.getElementById('btn_bgnd_linear_gradient').style.backgroundColor = 'lightgreen';
        }

        mouse_wheel = true;
      }

      async function set_equi() {
        await reset_scene_params();

        if (!equi_enabled) {
          if (!gui_set) {
            gui.add( params, 'backBlurriness', 0, 1 )
            .onChange( function ( value ) {
              scene.backgroundBlurriness = value;
              mouse_wheel = true;
            });

            gui.add( params, 'backIntensity', 0, 5 )
            .onChange( function ( value ) {
              scene.backgroundIntensity = value;
              mouse_wheel = true;
            });

            gui.open();
            gui_set = true;
          }

          document.getElementById('gui_position').style.display = 'block';
          set_gui_position();

          document.getElementById('btn_bgnd_linear_gradient').disabled = true;

          scene.background = tex;

          scene.backgroundBlurriness = params.backBlurriness;
          scene.backgroundIntensity = params.backIntensity;

          equi_enabled = true;
          document.getElementById('btn_equi').style.backgroundColor = 'lightgreen';
        } else {
          gui_reset();

          document.getElementById('btn_bgnd_linear_gradient').disabled = false;

          equi_enabled = false;
          document.getElementById('btn_equi').style.backgroundColor = 'transparent';
        }

        equi_changed();

        mouse_wheel = true;
      }

      function gui_reset() {
        scene.backgroundBlurriness = 0.0;
        scene.backgroundIntensity = 1.0;

        params.backBlurriness = 0.0;
        params.backIntensity = 1.0;

        gui.reset();

        document.getElementById('gui_position').style.display = 'none';

        mouse_wheel = true;
      }

      function set_model_scale( scale ) {
        document.getElementById('model_scale').selectedIndex = 0;

        const scalar_scale = parseFloat( scale.slice( 0, -1 ) );

        splats.scale.multiplyScalar( scalar_scale );

        mouse_wheel = true;
      }

      function quick_x_rotation( angle ) {
        document.getElementById('quick_rotation').selectedIndex = 0;

        splats.rotateX( Math.PI * parseFloat( angle ) );

        mouse_wheel = true;
      }

      function quick_y_rotation( angle ) {
        document.getElementById('quick_rotation').selectedIndex = 0;

        splats.rotateY( Math.PI * parseFloat( angle ) );

        mouse_wheel = true;
      }

      function quick_z_rotation( angle ) {
        document.getElementById('quick_rotation').selectedIndex = 0;

        splats.rotateZ( Math.PI * parseFloat( angle ) );

        mouse_wheel = true;
      }

      async function init() {
        if (!url_loading && document.getElementById('file_input').files.length === 0) return;

        document.getElementById('btn_load').disabled = true;
        document.getElementById('btn_file_input').disabled = true;
 
        if (scene) {
          if (splats) await scene_cleanup();
          reset_all( true );
        }

        init_running = true;

        enable_disable( true );

        if (params === undefined) {
          params = {
            backBlurriness: 0.0,
            backIntensity: 1.0
          };
        }

        splats = null;
        ftype = 'rad';
        isRAD = false;
        isSPZ = false;
        isSplat = false;
        selected_local_file = null;
        mouse_down = false;
        mouse_wheel = true;
        bgnd_linear_gradient = false;
        render_requested = false;
        equi_enabled = false;
        bounding_box = new THREE.Box3();

        console.time( 'Loading Time' );

        document.body.style.backgroundImage = 'none';
        document.getElementById('div_spinner').style.display = 'none';
        document.getElementById('div_error').style.display = 'none';
        document.getElementById('div_loading').style.display = 'block';
        document.getElementById('div_loading').innerHTML = 'Load & Visualize';

        if (renderer === undefined) {
          renderer = new THREE.WebGLRenderer( { antialias: false, alpha: true } );
          renderer.setPixelRatio( window.devicePixelRatio );
          renderer.toneMapping = THREE.NeutralToneMapping;
          renderer.toneMappingExposure = 1.0;
          renderer.info.autoReset = false;
          renderer.setSize( ww, wh );
          renderer.autoClear = true;

          document.body.appendChild( renderer.domElement );
        }

        if (!url_loading) {
          // Loaded splat file
          let fi = document.getElementById('file_input');
          let fn_lc = fi.files[ 0 ].name.toLowerCase();

          if (fmts.some( fmt => fn_lc.endsWith( fmt ) === true ) ) {
            selected_local_file = fi.files[ 0 ];
            const ext = fn_lc.substring( fn_lc.lastIndexOf( '.' ) + 1 );

            if (ext === 'ksplat') { ftype = 'ksplat'; isSplat = true; }
            else if (ext === 'splat') { ftype = 'splat'; isSplat = true; }
            else if (ext === 'spz') { ftype = 'splat'; isSPZ = true; }
            else if (ext === 'ply') ftype = 'ply';
            else if (ext === 'rad') isRAD = true;
            else if (ext === 'sog' || ext === 'zip') ftype = 'pcsogszip';
          }

          if (selected_local_file === null) {
            handle_error( 'No valid SPLAT file selected!' );
            return;
          }

          selected_url_file = '';
        } else {
          // Reset the file input
          document.getElementById('file_input').value = '';
          url_loading = false;
        }

        if (scene === undefined) {
          scene = new THREE.Scene();
          scene.backgroundRotation = new THREE.Euler( 0, Math.PI / 2.0, 0, 'XYZ' );
          scene.environmentRotation = new THREE.Euler( 0, Math.PI / 2.0, 0, 'XYZ' );

          spark_renderer = new SPARK.SparkRenderer({ 
            renderer: renderer,
            enableLod: true,
            lodSplatCount: 500000, // VRAM splat memory pool cap

            // CONTROL THE DISTANCE TRIGGER:
            // Higher numbers (e.g., 1.5 or 2.0) make Spark fetch close-up chunks 
            // from much further away. Lower numbers (e.g., 0.3) force it to wait 
            // until the camera is practically touching the object to fetch them.
            lodSplatScale: 1.0,

            // Drop processing threshold for small background splats
            lodRenderScale: 1.0,  // Higher values discard distant/tiny leaf chunks entirely

            // CONTROL THE EVICTION SPEED:
            // How often Spark calculates what chunks to drop or load based on camera movement.
            // 1 means every frame (very aggressive), 2-5 means every few frames (smoother performance).
            lodUpdateInterval: 5
          });

          scene.add( spark_renderer );
        }

        scene.backgroundBlurriness = 0;
        scene.backgroundIntensity = 1.0;

        if (!events_initialized) { initialize_event_listeners(); events_initialized = true; }

        if (camera === undefined) {
          camera = new THREE.PerspectiveCamera( 60, ww / wh, 0.05, 1e8 );
          camera.position.set( 0, 0, 5 );
          scene.add( camera );
        }

        if (controls === undefined) {
          const { OrbitControls } = await import( 'three/addons/controls/OrbitControls.min.js' );

          controls = new OrbitControls( camera, renderer.domElement );
          controls.enableZoom = true;
          controls.zoomToCursor = true;
          controls.zoomSpeed = 0.5;
          controls.rotateSpeed = 0.5;
          controls.keyPanSpeed = 0.5; 
          controls.panSpeed = 0.5;
          controls.minDistance = 0;
          controls.maxDistance = Infinity;
          //controls.enableDamping = true;
          //controls.dampingFactor = 0.3;
          //controls.enableKeys = false;
          //controls.maxPolarAngle = 2.2;
          //controls.minPolarAngle = 1.1;
        }

        // Start flashing indicator
        document.getElementById('status_indicator').style.display = 'inline-block';

        (selected_local_file !== null) ? loadFile() : loadURLFile();

        // Load equirectangular texture
        if (!tex) {
          // Regardless of its name, this is actually 2048 x 1024 image
          let url = 'https://raw.githubusercontent.com/GitHubDragonFly/three.js/dev/examples/textures/planets/earth_atmos_4096.avif';

          texture_loader.load( url, async function( texture ) {
            tex = texture;

            tex.mapping = THREE.EquirectangularReflectionMapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.needsUpdate = true;

            texture.dispose();
          });
        }
      }

      async function loadFile() {
        await yieldToMainThread();

        if (isSPZ) {
          if (transcode === undefined) {
            const { transcodeToSplatBuffer } = await import( '../static/jsm/utils/splatTranscoder.min.js' );
            transcode = transcodeToSplatBuffer;
          }

          await spz_loader.loadAsync( URL.createObjectURL( selected_local_file ),
          function( xhr ) { },
          function( error ) {
            URL.revokeObjectURL( selected_local_file );
            handle_error( error );
          }).then( async loaded_splat => {
            URL.revokeObjectURL( selected_local_file );

            await yieldToMainThread();

            // Trimming background and/or number of splats could be enabled

            const highSPZCount = loaded_splat.count > 1000000;

            const options = {
              backgroundFilterEnabled: false,
              brightness: highSPZCount ? 1.3 : 1.15,
              maxRadius: 14,
              sampleStep: highSPZCount ? 2 : 1,
              sh1Scale: 2.0,
              sh2Scale: 1.5,
              sh3Scale: 1.0,
              focusFactor: 1.0
            };

            const rawSplatArrayBuffer = await transcode( loaded_splat, options );

            await yieldToMainThread();

            // Break references to large inner typed arrays immediately
            loaded_splat.positions = null;
            loaded_splat.scales = null;
            loaded_splat.rotations = null;
            loaded_splat.colors = null;
            loaded_splat.sphericalHarmonics = null;
            loaded_splat = null; 

            try {
              const blob = new Blob( [ rawSplatArrayBuffer ], { type: 'application/octet-stream' } ); 
              splats = new SPARK.SplatMesh( { url: URL.createObjectURL( blob ), fileType: ftype } );
              URL.revokeObjectURL( blob );

              scene.add( splats );

              finish_loading();
            } catch( err ) {
              console.error( 'Error setting up SPZ splat: ', err );
            }
          });
        } else {
          splats = new SPARK.SplatMesh( { url: URL.createObjectURL( selected_local_file ), fileType: ftype } );
          URL.revokeObjectURL( selected_local_file );

          scene.add( splats );

          finish_loading();
        }
      }

      async function loadURLFile() {
        if (selected_url_file !== '') {
          if (selected_url_file.startsWith('https://www.dropbox.com') === true) {
            selected_url_file = selected_url_file.replace('www.dropbox.com', 'dl.dropbox.com');
          } else if (selected_url_file.startsWith('https://github.com') === true) {
            selected_url_file = ( selected_url_file.replace('github.com', 'raw.githubusercontent.com') ).replace('blob/', '');
          }

          let fn_lc = selected_url_file.toLowerCase();

          if (fmts.some( fmt => fn_lc.endsWith( fmt ) === true ) ) {
            const ext = fn_lc.substring( fn_lc.lastIndexOf( '.' ) + 1 );

            if (ext === 'ksplat') { ftype = 'ksplat'; isSplat = true; }
            else if (ext === 'splat') { ftype = 'splat'; isSplat = true; }
            else if (ext === 'spz') { ftype = 'splat'; isSPZ = true; }
            else if (ext === 'ply') ftype = 'ply';
            else if (ext === 'rad') { ftype = 'rad'; isRAD = true; }
            else if (ext === 'sog' || ext === 'zip') ftype = 'pcsogszip';
          }

          if (ftype === 'rad') {
            splats = new SPARK.SplatMesh( { url: selected_url_file, fileType: ftype, paged: true, enableLod: true } );

            scene.add( splats );
            finish_loading();
          } else {
            const response = await fetch( selected_url_file );

            if ( !response.ok ) {
              handle_error( 'Failed to fetch url: ' + selected_url_file );
              return;
            }

            await yieldToMainThread();

            const ab = await response.arrayBuffer();
            const blob = new Blob( [ ab ], { type: 'application/octet-stream' } );
            const blobURL = URL.createObjectURL( blob );

            await yieldToMainThread();

            if (isSPZ) {
              if (transcode === undefined) {
                const { transcodeToSplatBuffer } = await import( '../static/jsm/utils/splatTranscoder.min.js' );
                transcode = transcodeToSplatBuffer;
              }

              await spz_loader.loadAsync( blobURL,
              function( xhr ) { },
              function( error ) {
                URL.revokeObjectURL( blob );
                handle_error( error );
              }).then( async loaded_splat => {
                URL.revokeObjectURL( blob );

                await yieldToMainThread();

                // Trimming background and/or number of splats could be enabled

                const highSPZCount = loaded_splat.count > 1000000;

                const options = {
                  backgroundFilterEnabled: false,
                  brightness: highSPZCount ? 1.3 : 1.15,
                  maxRadius: 14,
                  sampleStep: highSPZCount ? 2 : 1,
                  sh1Scale: 2.0,
                  sh2Scale: 1.5,
                  sh3Scale: 1.0,
                  focusFactor: 1.0
                };

                const rawSplatArrayBuffer = await transcode( loaded_splat, options );

                await yieldToMainThread();

                // Break references to large inner typed arrays immediately
                loaded_splat.positions = null;
                loaded_splat.scales = null;
                loaded_splat.rotations = null;
                loaded_splat.colors = null;
                loaded_splat.sphericalHarmonics = null;
                loaded_splat = null; 

                try {
                  const blob = new Blob( [ rawSplatArrayBuffer ], { type: 'application/octet-stream' } ); 
                  splats = new SPARK.SplatMesh( { url: URL.createObjectURL( blob ), fileType: ftype, enableLod: true } );
                  URL.revokeObjectURL( blob );

                  scene.add( splats );
                  finish_loading();
                } catch( err ) {
                  console.error( 'Error setting up SPZ splat: ', err );
                }
              });
            } else {
              splats = new SPARK.SplatMesh( { url: blobURL, fileType: ftype } );
              URL.revokeObjectURL( blob );

              scene.add( splats );
              finish_loading();
            }
          }
        }
      }

      async function finish_loading() {
        await yieldToMainThread();

        console.timeEnd( 'Loading Time' );

        init_running = false;

        document.getElementById('btn_load').disabled = false;
        document.getElementById('btn_file_input').disabled = false;

        document.body.style.backgroundImage = 'none';

        enable_disable( false );

        render_requested = true;
        mouse_wheel = true;
        first_run = true;
        fr_count = 0;
        render();

        splats.rotateX( Math.PI );

        await yieldToMainThread();

        if (!isMobile) await new Promise( resolve => setTimeout( log_info, 3000 ) );
      }

      function log_info() {
        console.log( 'Memory: ', renderer.info.memory );
        console.log( 'Render: ', renderer.info.render );
      }

      function handle_error( error ) {
        console.timeEnd( 'Loading Time' );
        console.log( 'Error loading model!' );
        console.log( error );
        mouse_wheel = true;
        render_requested = false;
        enable_disable( true );

        init_running = false;

        // Stop flashing indicator
        document.getElementById('status_indicator').style.display = 'none';

        document.getElementById('btn_load').disabled = false;
        document.getElementById('btn_file_input').disabled = false;
        disabled_changed();

        document.getElementById('div_loading').style.display = 'none';
        document.getElementById('div_error').style.display = 'block';
      }

      async function render() {
        if (splats) {
          if (first_run || mouse_down || mouse_wheel || reset_rotation) {
            // Reset splats rotational values
            if (reset_rotation) {
              splats.rotation.set( 0, 0, 0 );
              reset_rotation = false;
            }

            // If it might be slow to render initially
            if (first_run) {
              fr_count ++;

              if (fr_count > 100) {
                count = 0;
                fr_count = 0;
                first_run = false;
                mouse_wheel = true;

                // Stop flashing indicator
                document.getElementById('status_indicator').style.display = 'none';

                document.getElementById('div_loading').style.display = 'none';
              }
            } else {
              if (mouse_wheel) {
                if (count > 600) {
                  mouse_wheel = false;
                  count = 0;
                } else {
                  count ++;
                }
              }
            }

            controls.update();

            renderer.render( scene, camera );
          }
        }

        if (render_requested) requestAnimationFrame( render );
      }

      function reset_only() {
        if (gui) gui_reset();

        reset_all( true );

        console.time( 'Loading Time' );

        document.getElementById('div_loading').innerText = 'Reload';
        document.getElementById('div_loading').style.display = 'block';

        mouse_wheel = true;

        init();
      }

      async function reset_all( reset = false ) {
        // Reset linear gradient values
        bgnd_linear_gradient = false;
        document.getElementById('btn_bgnd_linear_gradient').disabled = false;
        document.getElementById('btn_bgnd_linear_gradient').style.backgroundColor = 'transparent';

        // Reset equi values
        equi_enabled = false;
        document.getElementById('btn_equi').style.backgroundColor = 'transparent';

        if (scene) {
          if (scene.environment) {
            scene.environment.dispose();
            scene.environment = null;
          }

          if (scene.background) {
            scene.background.dispose();
            scene.background = null;
          }
        }

        if (gui_set) {
          document.getElementById('gui_position').style.display = 'none';
        }

        reset_rotation = true;

        // Reset the view
        if (reset) {
          controls.reset();
          first_run = true;
          fr_count = 0;
          await render();
        } else {
          // Page (re)loading
          if (scene) {
            if (splats) await scene_cleanup();

            while (scene.children.length > 0) {
              scene.remove( scene.children[ 0 ] );
            }

            renderer.clear();
            renderer.dispose();
          }

          document.getElementById('file_input').value = '';
          document.getElementById('div_error').style.display = 'none';
          document.getElementById('div_spinner').style.display = 'block';
          document.getElementById('url_entry').value = '';
          selected_url_file = '';
          enable_disable( true );
        }

        disabled_changed();

        mouse_wheel = true;
      }

      async function scene_cleanup() {
        scene.remove( splats );

        render_requested = false;
        renderer.clear();

        await yieldToMainThread();

        spark_renderer.quaternion.set( 0, 0, 0, 1 );

        splats.traverse( async ( child ) => {
          if (child.isMesh || child.isPoints || child.isObject3D) {
            if (child.dispose) {
              await child.dispose();
            } else {
              if (child.material) {
                if (child.material.uniforms) {
                  Object.keys( child.material.uniforms ).forEach( ( key ) => {
                    if (child.material.uniforms[ key ]?.value?.isTexture) {
                      child.material.uniforms[ key ].value.dispose();
                    }
                  });
                } else {
                  let m = child.material;

                  for (const prop in m) {
                    if (m[ prop ]?.isTexture) m[ prop ].dispose();
                  };
                }

                child.material.dispose();
                child.material = null;
              }

              if (child.geometry) {
                child.geometry.dispose();
                child.geometry = null;
              }
            }
          }
        });

        THREE.Cache.clear();

        if (!isMobile) {
          renderer.info.reset();
          renderer.resetState();
        }
      }

      function enable_disable( disable = false ) {
        document.getElementById('quick_rotation').disabled = disable;
        document.getElementById('btn_equi').disabled = disable;
        document.getElementById('model_scale').disabled = disable;
        document.getElementById('btn_bgnd_linear_gradient').disabled = disable;
        document.getElementById('reset').disabled = disable;
        disabled_changed();

        mouse_wheel = true;
      }
    </script>

    <script>
      function document_ready() {
        isNewiPad = (/iPad/.test( navigator.platform ) && (/Mac OS X/i.test( navigator.userAgent ))) ||
          (navigator.maxTouchPoints !== undefined && navigator.maxTouchPoints > 2 && /MacIntel/.test( navigator.platform ));

        isMobile = !isNewiPad && ((/iPhone|iPad|iPod/.test( navigator.platform )) ||
          (/Android|webOS|iPhone|iPad|iPod|BlackBerry|CriOS|IEMobile|Opera Mini/i.test( navigator.userAgent )));

        $('#url_entry').keypress( function( event ) { if (event.key === 'Enter') $('#btn_load').click(); });
        $('#model_scale').keypress( function( event ) { if (event.key === 'Enter') $(this).children(':selected').click(); });
        $('#quick_rotation').keypress( function( event ) { if (event.key === 'Enter') $(this).children(':selected').click(); });

        if (navigator.userAgent.indexOf('Chrome') > -1 || navigator.userAgent.indexOf('Safari') > -1 || isMobile) {
          $('#model_scale').change( function() { $(this).children(':selected').click(); });
          $('#quick_rotation').change( function() { $(this).children(':selected').click(); });
        }

        document.getElementById('model_scale').selectedIndex = 0;
        document.getElementById('quick_rotation').selectedIndex = 0;

        if (!isMobile) {
          $('#reset')[ 0 ].style.display = '';
          $('#btn_equi')[ 0 ].style.display = '';
          $('#btn_full_screen')[ 0 ].style.display = '';
          $('#btn_menu_location')[ 0 ].style.display = '';
        }
      }

      function disabled_changed() {
        $('button').each( function() {
          if (!this.disabled) {
            $(this).hover(
            function() { $(this)[ 0 ].style.border = 'solid 2px red'; },
            function() { $(this)[ 0 ].style.border = 'solid 1px blue'; });
          } else {
            $(this).unbind('mouseenter mouseleave');
          }

          mouse_wheel = true;
        });

        $('select').each( function() {
          if (!this.disabled) {
            $(this).hover(
            function() { $(this)[ 0 ].style.border = 'solid 2px red'; },
            function() { $(this)[ 0 ].style.border = 'solid 1px blue'; });
          } else {
            $(this).unbind('mouseenter mouseleave');
          }

          mouse_wheel = true;
        });
      }

      function equi_changed() {
        if (equi_enabled) {
          $('#btn_bgnd_linear_gradient').unbind('mouseenter mouseleave');
        } else {
          $('#btn_bgnd_linear_gradient').hover(
          function() { $(this)[ 0 ].style.border = 'solid 2px red'; },
          function() { $(this)[ 0 ].style.border = 'solid 1px blue'; });
        }

        mouse_wheel = true;
      }
    </script>
  </body>
